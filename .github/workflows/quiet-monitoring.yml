name: Quiet monitoring contract

on:
  pull_request:
    paths:
      - 'src/error-bus.js'
      - 'tests/quiet-monitoring.test.mjs'
      - '.github/workflows/quiet-monitoring.yml'
  push:
    branches: [main]
    paths:
      - 'src/error-bus.js'
      - 'tests/quiet-monitoring.test.mjs'
      - '.github/workflows/quiet-monitoring.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/error-bus.js
      - run: node --test tests/quiet-monitoring.test.mjs
